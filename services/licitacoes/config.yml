# ══════════════════════════════════════════════════════════════
#  Scanner de Licitações v3 — AttanoTech
#  Agora filtra somente licitações ABERTAS do ano corrente
# ══════════════════════════════════════════════════════════════

# ── Perfil da empresa ─────────────────────────────────────────
empresa:
  nome: "AttanoTech"
  area: "Consultoria de tecnologia e projetos/implantações de TI"
  servicos:
    - consultoria em tecnologia da informação
    - desenvolvimento de software
    - implantação de sistemas
    - suporte técnico em TI
    - infraestrutura de redes
    - cloud computing e migração
    - segurança da informação
    - treinamento em tecnologia
    - manutenção de equipamentos de informática
    - outsourcing de TI
  palavras_chave:
    - tecnologia da informação
    - desenvolvimento de software
    - sistemas de informação
    - consultoria TI
    - infraestrutura de rede
    - segurança cibernética
    - cloud computing
    - suporte técnico
    - licenciamento de software
    - transformação digital
    - inteligência artificial
    - automação
  regiao: "São Paulo"
  porte: "ME/EPP"

# ── Arquivo CSV com todos os portais mapeados ─────────────────
portais_csv: "portais.csv"

# ── Buscas no SearXNG ─────────────────────────────────────────
# NOTA v3: queries agora incluem "2026" e "aberto/aberta" para
# filtrar por ano corrente e status. Ao mudar de ano, atualize aqui.
searxng_queries:
  - "licitação tecnologia da informação 2026 aberta"
  - "pregão eletrônico TI consultoria 2026"
  - "licitação software desenvolvimento sistema 2026 aberta"
  - "pregão infraestrutura rede informática 2026"
  - "licitação suporte técnico informática 2026 aberta"
  - "pregão cloud computing governo 2026"
  - "licitação segurança informação 2026"
  - "dispensa licitação serviços TI 2026"
  - "pregão consultoria transformação digital 2026"

# ── Buscas direcionadas por portal (site:domínio) ─────────────
busca_por_portal:
  enabled: true
  tipos:
    - estadual
    - federal
    - privado
  ufs_filtro: []
  # v3: queries por site também incluem ano
  queries_por_site:
    - "licitação tecnologia informação 2026"
    - "pregão TI consultoria software 2026 aberto"

# ── PNCP API (Portal Nacional de Contratações Públicas) ───────
# v3: agora usa DOIS endpoints:
#   - /proposta  → licitações com propostas ABERTAS (prioridade)
#   - /publicacao → publicações recentes (com codigoModalidade obrigatório)
pncp:
  enabled: true
  base_url: "https://pncp.gov.br/api/consulta/v1/contratacoes/publicacao"
  palavras: "tecnologia informação,software,consultoria TI,infraestrutura rede,suporte técnico,cloud computing,segurança informação,desenvolvimento sistemas"
  dias_retroativos: 7
  max_items: 50
  ufs_filtro: []

# ── APIs estaduais com dados abertos ──────────────────────────
apis_estaduais:
  - nome: "Compras.gov.br (Dados Abertos)"
    url: "https://dadosabertos.compras.gov.br/modulo-contratacao/1_consultarContratacao"
    enabled: false
    nota: "Requer análise dos endpoints disponíveis"

  - nome: "Portal da Transparência (CGU)"
    url: "https://api.portaldatransparencia.gov.br/api-de-dados/licitacoes"
    enabled: false
    nota: "Requer cadastro para API key"

  - nome: "Compras MG (PRODEMGE)"
    url: "https://api.prodemge.gov.br/"
    enabled: false
    nota: "API com dados de compras estaduais de MG"

  - nome: "TCE-RJ Dados Abertos"
    url: "https://dados.tcerj.tc.br/api/v1/"
    enabled: false
    nota: "Licitações do estado do RJ em JSON/CSV"

# ── Filtros ───────────────────────────────────────────────────
filtros:
  valor_minimo: 0
  valor_maximo: 5000000
  modalidades_aceitas:
    - pregao
    - concorrencia
    - dispensa
  score_minimo: 30
  # v3: novos filtros de status
  somente_abertas: true
  ano_corrente_obrigatorio: true

# ── Relatório ─────────────────────────────────────────────────
max_items_relatorio: 15
tts_enabled: false