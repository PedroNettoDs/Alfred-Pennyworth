# ══════════════════════════════════════════════════════════════
#  Scanner de Licitações — AttanoTech
#  Edite este arquivo para ajustar perfil e fontes
# ══════════════════════════════════════════════════════════════

# ── Perfil da empresa ─────────────────────────────────────────
empresa:
  nome: "AttanoTech"
  area: "Consultoria de tecnologia e projetos/implantações de TI"
  servicos:
    - consultoria em tecnologia da informação
    - desenvolvimento de software
    - implantação de sistemas
    - suporte técnico em TI
    - infraestrutura de redes
    - cloud computing e migração
    - segurança da informação
    - treinamento em tecnologia
    - manutenção de equipamentos de informática
    - outsourcing de TI
  palavras_chave:
    - tecnologia da informação
    - desenvolvimento de software
    - sistemas de informação
    - consultoria TI
    - infraestrutura de rede
    - segurança cibernética
    - cloud computing
    - suporte técnico
    - licenciamento de software
    - transformação digital
    - inteligência artificial
    - automação
  regiao: "São Paulo"
  porte: "ME/EPP"

# ── Arquivo CSV com todos os portais mapeados ─────────────────
# Colunas: uf,estado,regiao,portal,url,tipo,api
portais_csv: "portais.csv"

# ── Buscas no SearXNG ─────────────────────────────────────────
# Queries genéricas (sem site: — o SearXNG busca em tudo)
searxng_queries:
  - "licitação tecnologia da informação 2026"
  - "pregão eletrônico TI consultoria"
  - "licitação software desenvolvimento sistema"
  - "pregão infraestrutura rede informática"
  - "licitação suporte técnico informática"
  - "pregão cloud computing governo"
  - "licitação segurança informação"
  - "dispensa licitação serviços TI"
  - "pregão consultoria transformação digital"

# ── Buscas direcionadas por portal (site:domínio) ─────────────
# O scanner gera automaticamente queries "site:URL licitação TI"
# para cada portal do CSV. Abaixo, controle quais tipos incluir.
busca_por_portal:
  enabled: true
  # Quais tipos de portal buscar via site: (estadual, federal, privado)
  tipos:
    - estadual
    - federal
    - privado
  # Filtrar por UFs específicas (vazio = todas)
  # Exemplo: ["SP", "MG", "RJ", "PR"] para focar no Sudeste+Sul
  ufs_filtro: []
  # Queries usadas com site:domínio
  queries_por_site:
    - "licitação tecnologia informação"
    - "pregão TI consultoria software"

# ── PNCP API (Portal Nacional de Contratações Públicas) ───────
# API pública, sem autenticação — agrega TODOS os estados
pncp:
  enabled: true
  base_url: "https://pncp.gov.br/api/consulta/v1/contratacoes/publicacao"
  palavras: "tecnologia informação,software,consultoria TI,infraestrutura rede,suporte técnico,cloud computing,segurança informação,desenvolvimento sistemas"
  dias_retroativos: 3
  max_items: 50
  # Filtrar por UFs específicas (vazio = nacional)
  ufs_filtro: []

# ── APIs estaduais com dados abertos ──────────────────────────
apis_estaduais:
  # Compras.gov.br (federal — inclui SP que migrou para cá)
  - nome: "Compras.gov.br (Dados Abertos)"
    url: "https://dadosabertos.compras.gov.br/modulo-contratacao/1_consultarContratacao"
    enabled: false
    nota: "Requer análise dos endpoints disponíveis"

  # Portal da Transparência CGU
  - nome: "Portal da Transparência (CGU)"
    url: "https://api.portaldatransparencia.gov.br/api-de-dados/licitacoes"
    enabled: false
    nota: "Requer cadastro para API key"

  # Minas Gerais (PRODEMGE)
  - nome: "Compras MG (PRODEMGE)"
    url: "https://api.prodemge.gov.br/"
    enabled: false
    nota: "API com dados de compras estaduais de MG"

  # Rio de Janeiro (TCE-RJ)
  - nome: "TCE-RJ Dados Abertos"
    url: "https://dados.tcerj.tc.br/api/v1/"
    enabled: false
    nota: "Licitações do estado do RJ em JSON/CSV"

# ── Filtros ───────────────────────────────────────────────────
filtros:
  valor_minimo: 0
  valor_maximo: 5000000
  modalidades_aceitas:
    - pregao
    - concorrencia
    - dispensa
  score_minimo: 30

# ── Relatório ─────────────────────────────────────────────────
max_items_relatorio: 15
tts_enabled: false
