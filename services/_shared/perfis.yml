scanners: {}

# ── Inbox Assistant — caixas de e-mail monitoradas ────────────
# Lê o Thunderbird local (cópias offline), classifica cada e-mail com o
# Ollama, monta a "edição do dia" com as newsletters (mesmo pipeline do
# briefing) e cria pendências "vou / não vou" para eventos e contatos.
inbox:
  pedro_hotmail:
    perfil: pedro_dev
    backend: thunderbird          # thunderbird | imap
    conta: "outlook.office365.com" # substring do hostname/nome da conta no Thunderbird (vazio = todas)
    pastas: [INBOX]
    janela_horas: 36              # só e-mails mais recentes que isso entram no ciclo
    max_emails: 80                # limite de segurança por ciclo
    so_nao_lidos: false           # true = ignora e-mails já lidos no Thunderbird

    # Classificação — atalhos determinísticos antes do LLM (domínio ou endereço, substring)
    remetentes_noticia:           # sempre tratados como "noticia"
      - tldr.tech
      - hnrss.org
      - substack.com
      - news.ycombinator.com
      - theverge.com
      - arstechnica.com
      - infoq.com
    remetentes_ignorar:           # nunca entram no ciclo (promoções conhecidas)
      - promo.kabum.com.br
      - mail.vivo.com.br
      - r.mercadopago.com.br
      - lojareversa.com.br
      - melhoramigo.gringo.com.vc
    confianca_minima: 0.55        # abaixo disso o e-mail vai pra "outro"

    jornal:
      formato: [markdown, audio]
      tts_voice: "pt-BR-FranciscaNeural"
      template_prompt: jornal_email
      template_audio: audio_jornal
      max_noticias: 18            # itens que entram no clustering
      max_por_email: 6            # notícias extraídas por newsletter
      min_noticias: 2             # abaixo disso não gera edição
      pesos_fontes: {}            # opcional: {"TLDR": 0.9} — chave = nome do remetente

    # Podcast semanal (services/inbox/semanal.py) — lê as edições da semana em VAULT_NOTICIAS/jornal
    podcast:
      formato: [markdown, audio]
      vozes:                      # duas vozes edge-tts em diálogo
        ALFRED: "pt-BR-AntonioNeural"
        LUCIA:  "pt-BR-FranciscaNeural"
      template_segmento: podcast_semanal_segmento
      template_moldura: podcast_semanal_moldura
      max_temas: 7                # temas da semana (clusters) que viram segmento
      min_noticias: 3             # abaixo disso não gera episódio
      palavras_por_tema: 220      # ~1,5 min por tema → episódio de 10-13 min
      pausa_ms: 350               # silêncio entre falas
      vinheta: ""                 # opcional: .mp3 tocado no início e no fim

    pendencias:
      tts_voice: "pt-BR-AntonioNeural"
      template_pergunta: pergunta_evento
      template_audio: audio_pergunta_evento
      lembrar_a_cada_horas: 12    # re-notifica pendências aguardando
      expirar_apos_evento: true   # marca como expirada se a data do evento passou

    # Limpeza pós-podcast (services/inbox/LIMPEZA.md) — sempre pergunta antes; executa só via extensão
    # do Thunderbird, que MOVE para a Lixeira. contato/evento/pessoal e pendências aguardando nunca entram.
    limpeza:
      ativo: true
      dias_minimos: 30            # promocao/transacional/ignorado mais antigos que isso viram candidatos
      categorias: [promocao, transacional, ignorado]
      usar_manifestos: true       # e-mails já usados num episódio (VAULT_NOTICIAS/podcast/manifestos)
      max_por_lote: 200
      expirar_lote_dias: 7        # pergunta sem resposta expira

# ── WhatsApp — mensagens recebidas via Evolution API ──────────
# Texto e áudio (transcrito localmente com gemma4) passam pelo mesmo
# tratamento do e-mail: classificação → pendência "o que você quer
# responder?" (texto + áudio) → a resposta de Pedro volta pelo WhatsApp.
# Instância, chave e número de Pedro ficam no .env (EVOLUTION_*, WHATSAPP_*).
whatsapp:
  pedro_whatsapp:
    perfil: pedro_dev
    grupos: ignorar               # ignorar | mencao (só se Pedro for mencionado) | todos
    pessoal_vira_pendencia: true  # false = só "profissional" vira pendência
    so_se_requer_resposta: true   # false = toda mensagem relevante vira pendência, mesmo "ok, obrigado"
    confianca_minima: 0.5         # abaixo disso a categoria vira "outro" (sem pendência)
    atraso_minutos: 20            # espera isso sem resposta de Pedro na conversa antes de resumir/avisar (0 = na hora)
    agrupar_minutos: 30           # novas mensagens do mesmo contato entram na pendência aberta
    audio_max_segundos: 600       # transcreve no máximo isso (gemma4 ouve em fatias de 30 s)
    contatos_ignorar: []          # substrings de número ou nome que nunca viram pendência
    contatos_sempre: []           # substrings de número ou nome que viram pendência sem passar pelo LLM
    audio_reter_dias: 2           # áudios de resumo (.mp3) são apagados depois disso — a cópia fica no WhatsApp

    pendencias:
      tts_voice: "pt-BR-AntonioNeural"
      template_pergunta: pergunta_whatsapp
      template_audio: audio_pergunta_whatsapp
      lembrar_a_cada_horas: 6
      tocar_ao_notificar: true    # o resumo em áudio começa junto com a notificação (botões Parar / Ouvir)

# ── Agenda — compromissos detectados → calendário do Thunderbird ──
# Evento / tarefa / lembrete com data detectado no WhatsApp (contatos ou notas para você mesmo)
# ou "vou" num convite de e-mail → VAULT_ALFRED/agenda/agenda.yml → extensão "Alfred — agenda"
# grava no calendário abaixo (o Google, via CalDAV, aparece no celular).
agenda:
  calendario: "Agenda"          # nome do calendário no Thunderbird
  duracao_min: 60               # duração padrão de evento sem hora de término
  lembrete_min: 30              # alarme antes do horário (0 = sem alarme)
  confianca_minima: 0.7         # abaixo disso a detecção é ignorada
  auto_whatsapp: true           # mensagens de contatos com compromisso marcado
  notas_para_mim: true          # o que você escreve para si mesmo no WhatsApp ("me lembra de...")
  auto_email_vou: true          # responder "vou" a um convite de e-mail com data
  criar_tarefa: true            # tarefa/lembrete também vira item em tasks.yml
  notificar: true               # notificação no PC com [Ok] [Desfazer]

