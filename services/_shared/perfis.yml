# ── Coleções de fontes reutilizáveis ──────────────────────────
fontes:
  searxng_tech:
    tipo: searxng
    queries:
      - { q: "últimas notícias tecnologia", cat: "news,it" }
      - { q: "cloud computing infraestrutura novidades", cat: "news,it" }
      - { q: "cibersegurança vulnerabilidade", cat: "news,it" }
      - { q: "open source", cat: "news,it" }
      - { q: "notícias tecnologia", cat: "news,it" }
      - { q: "startups tech", cat: "news,it" }

  rss_tech:
    tipo: rss
    feeds:
      - { nome: "TabNews", url: "https://www.tabnews.com.br/recentes/rss", max: 10 }
      - { nome: "Hacker News", url: "https://hnrss.org/frontpage", max: 10 }
      - { nome: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/index", max: 5 }
      - { nome: "The Verge", url: "https://www.theverge.com/rss/index.xml", max: 5 }
      - { nome: "TechCrunch", url: "https://techcrunch.com/feed/", max: 5 }
      - { nome: "InfoQ", url: "https://feed.infoq.com/", max: 5 }
      - { nome: "Lobsters", url: "https://lobste.rs/rss", max: 5 }
      - { nome: "TLDR", url: "https://tldr.tech/api/rss/tech", max: 10 }
      - { nome: "MIT Tech Review", url: "https://www.technologyreview.com/feed/", max: 5 }
      - { nome: "Tecnoblog", url: "https://tecnoblog.net/feed/", max: 5 }

# ── Definições de briefings ───────────────────────────────────
briefings:
