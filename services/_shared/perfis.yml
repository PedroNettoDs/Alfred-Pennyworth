    interesses_quentes:
      - DevOps e automação
      - homelab e self-hosting
      - LLMs locais
      - RAG e vector databases
      - Ollama e modelos open-source
    interesses_mornos:
      - Kubernetes
      - observabilidade
      - Rust
    excluir:
      - blockchain marketing
    idiomas: [pt, en]
    tom: "técnico, direto, humor seco britânico"

  attanotech:
    nome: "AttanoTech"
    descricao: "Consultoria de TI, ME/EPP, atende interior de SP"
    area: "Consultoria de tecnologia e projetos/implantações de TI"
    servicos:
      - consultoria em tecnologia da informação
      - desenvolvimento de software
      - implantação de sistemas
      - suporte técnico em TI
      - infraestrutura de redes
      - cloud computing e migração
      - segurança da informação
      - treinamento em tecnologia
      - manutenção de equipamentos de informática
      - outsourcing de TI
    palavras_chave:
      - tecnologia da informação
      - desenvolvimento de software
      - sistemas de informação
      - consultoria TI
      - infraestrutura de rede
      - segurança cibernética
      - cloud computing
      - suporte técnico
      - licenciamento de software
      - transformação digital
      - inteligência artificial
      - automação
    tom: "executivo, foco em oportunidades concretas"

# ── Coleções de fontes reutilizáveis ──────────────────────────
fontes:
  searxng_tech:
    tipo: searxng
    queries:
      - { q: "últimas notícias tecnologia", cat: "news,it" }
      - { q: "cloud computing infraestrutura novidades", cat: "news,it" }
      - { q: "cibersegurança vulnerabilidade", cat: "news,it" }
      - { q: "open source", cat: "news,it" }
      - { q: "notícias tecnologia", cat: "news,it" }
      - { q: "startups tech", cat: "news,it" }

  rss_tech:
    tipo: rss
    feeds:
      - { nome: "TabNews", url: "https://www.tabnews.com.br/recentes/rss", max: 10 }
      - { nome: "Hacker News", url: "https://hnrss.org/frontpage", max: 10 }
      - { nome: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/index", max: 5 }
      - { nome: "The Verge", url: "https://www.theverge.com/rss/index.xml", max: 5 }
      - { nome: "TechCrunch", url: "https://techcrunch.com/feed/", max: 5 }
      - { nome: "InfoQ", url: "https://feed.infoq.com/", max: 5 }
      - { nome: "Lobsters", url: "https://lobste.rs/rss", max: 5 }
      - { nome: "TLDR", url: "https://tldr.tech/api/rss/tech", max: 10 }
      - { nome: "MIT Tech Review", url: "https://www.technologyreview.com/feed/", max: 5 }
      - { nome: "Tecnoblog", url: "https://tecnoblog.net/feed/", max: 5 }

# ── Definições de briefings ───────────────────────────────────
briefings:
  matinal_tech:
    perfil: pedro_dev
    fontes: [rss_tech]
    horario: "07:00"
    max_items: 15
    formato: [markdown, audio]
    tts_voice: "pt-BR-FranciscaNeural"
    template_prompt: briefing_tecnico
    template_audio: audio_tecnico

  vespertino_mercado:
    perfil: attanotech
    fontes: [searxng_tech, rss_tech]
    horario: "18:00"
    max_items: 10
    formato: [markdown, audio]
    tts_voice: "pt-BR-AntonioNeural"
    template_prompt: briefing_executivo
    template_audio: audio_executivo

scanners: {}

# ── Inbox Assistant — caixas de e-mail monitoradas ────────────
# Lê o Thunderbird local (cópias offline), classifica cada e-mail com o
# Ollama, monta a "edição do dia" com as newsletters (mesmo pipeline do
# briefing) e cria pendências "vou / não vou" para eventos e contatos.
inbox:
  pedro_hotmail:
    perfil: pedro_dev
    backend: thunderbird          # thunderbird | imap
    conta: "outlook.office365.com" # substring do hostname/nome da conta no Thunderbird (vazio = todas)
    pastas: [INBOX]
    janela_horas: 36              # só e-mails mais recentes que isso entram no ciclo
    max_emails: 80                # limite de segurança por ciclo
    so_nao_lidos: false           # true = ignora e-mails já lidos no Thunderbird

    # Classificação — atalhos determinísticos antes do LLM (domínio ou endereço, substring)
    remetentes_noticia:           # sempre tratados como "noticia"
      - tldr.tech
      - hnrss.org
      - substack.com
      - news.ycombinator.com
      - theverge.com
      - arstechnica.com
      - infoq.com
    remetentes_ignorar:           # nunca entram no ciclo (promoções conhecidas)
      - promo.kabum.com.br
      - mail.vivo.com.br
      - r.mercadopago.com.br
      - lojareversa.com.br
      - melhoramigo.gringo.com.vc
    confianca_minima: 0.55        # abaixo disso o e-mail vai pra "outro"
    cache_classificacao: true     # remetente de envio em massa que o LLM classificou 3x como promoção/transacional pula o LLM (SQLite)

    jornal:
      formato: [markdown, audio]
      tts_voice: "pt-BR-FranciscaNeural"
      template_prompt: jornal_email
      template_audio: audio_jornal
      max_noticias: 18            # itens que entram no clustering
      max_por_email: 6            # notícias extraídas por newsletter
      min_noticias: 2             # abaixo disso não gera edição
      pesos_fontes: {}            # opcional: {"TLDR": 0.9} — chave = nome do remetente

    # Podcast semanal (services/inbox/semanal.py) — lê as edições da semana em VAULT_NOTICIAS/jornal
    podcast:
      intervalo_dias: 3           # um episódio a cada 3 dias, cobrindo os últimos 3 dias (timer diário + --se-devido)
      incluir_briefings: true     # além do jornal do e-mail, usa os briefings por RSS (VAULT_ALFRED/briefings)
      formato: [markdown, audio]
      vozes:                      # duas vozes em diálogo (lib_tts.VOZES_PIPER: faber e cadu, as duas masculinas)
        ALFRED: "pt-BR-AntonioNeural"
        LUCIA:  "pt-BR-FranciscaNeural"
      template_segmento: podcast_semanal_segmento
      template_moldura: podcast_semanal_moldura
      max_temas: 7                # temas do período (clusters) que viram segmento
      min_noticias: 3             # abaixo disso não gera episódio
      palavras_por_tema: 220      # ~1,5 min por tema → episódio de 10-13 min
      pausa_ms: 350               # silêncio entre falas
      vinheta: ""                 # opcional: .mp3 tocado no início e no fim

    pendencias:
      tts_voice: "pt-BR-AntonioNeural"
      template_pergunta: pergunta_evento
      template_audio: audio_pergunta_evento
      lembrar_a_cada_horas: 12    # re-notifica pendências aguardando
      expirar_apos_evento: true   # marca como expirada se a data do evento passou

    # Limpeza pós-podcast (services/inbox/LIMPEZA.md) — sempre pergunta antes; executa só via extensão
    # do Thunderbird, que MOVE para a Lixeira. contato/evento/pessoal e pendências aguardando nunca entram.
    limpeza:
      ativo: true
      dias_minimos: 0             # promocao/transacional/ignorado mais antigos que isso viram candidatos (0 = qualquer idade)
      categorias: [promocao, transacional, ignorado]
      usar_manifestos: true       # e-mails já usados num episódio (VAULT_NOTICIAS/podcast/manifestos)
      max_por_lote: 200
      expirar_lote_dias: 7        # pergunta sem resposta expira

# ── WhatsApp — mensagens recebidas via Evolution API ──────────
# Texto e áudio (transcrito localmente com gemma4) passam pelo mesmo
# tratamento do e-mail: classificação → pendência "o que você quer
# responder?" (texto + áudio) → a resposta de Pedro volta pelo WhatsApp.
# Chave e número de Pedro ficam no .env (EVOLUTION_*, WHATSAPP_*).
# Cada conta é uma SESSÃO: uma instância da Evolution (um número pareado por QR) com um papel.
#   papel: pessoal    → o seu número: o fluxo acima.
#   papel: assistente → o número do Alfred: você manda ordens (lembrete → agenda) e os outros são recepcionados.
# O papel escolhido no Painel (Sistema → WhatsApp) vale mais que o daqui. Só uma sessão é a assistente.
# Parear: ./run.sh whatsapp qrcode --sessao NOME · webhook: ./run.sh whatsapp webhook URL --sessao NOME
whatsapp:
  pedro_whatsapp:
    perfil: pedro_dev
    papel: pessoal                # instância: EVOLUTION_INSTANCE do .env (conta padrão, WHATSAPP_DEFAULT)
    grupos: ignorar               # ignorar | mencao (só se Pedro for mencionado) | todos
    pessoal_vira_pendencia: true  # false = só "profissional" vira pendência
    so_se_requer_resposta: true   # false = toda mensagem relevante vira pendência, mesmo "ok, obrigado"
    confianca_minima: 0.5         # abaixo disso a categoria vira "outro" (sem pendência)
    atraso_minutos: 10            # espera isso sem resposta de Pedro na conversa antes de resumir/avisar (0 = na hora)
    agrupar_minutos: 30           # novas mensagens do mesmo contato entram na pendência aberta
    audio_max_segundos: 600       # transcreve no máximo isso (gemma4 ouve em fatias de 30 s)
    contatos_ignorar: []          # substrings de número ou nome que nunca viram pendência
    contatos_sempre: []           # substrings de número ou nome que viram pendência sem passar pelo LLM
    audio_reter_dias: 2           # áudios de resumo (.mp3) são apagados depois disso — a cópia fica no WhatsApp
    historico: true               # grava o texto das conversas (não ignoradas) em alfred.db (SQLite FTS5): contexto do prompt + busca
    historico_dias: 90            # apaga mensagens gravadas há mais que isso (0 = guarda tudo)
    cache_classificacao: true     # contato que o LLM classificou 3x como automático/spam pula o LLM (nunca para gente)

    pendencias:
      tts_voice: "pt-BR-AntonioNeural"
      template_pergunta: pergunta_whatsapp
      template_audio: audio_pergunta_whatsapp
      lembrar_a_cada_horas: 6
      tocar_ao_notificar: true    # o resumo em áudio começa junto com a notificação (botões Parar / Ouvir)

  # Segundo número, "do Alfred". Você (WHATSAPP_NUMERO_PEDRO) escreve ou fala → vai para a agenda (sem data
  # vira lembrete de hoje). Outra pessoa → uma saudação; se a conversa for séria (o Alfred julga com o seu
  # perfil e a memória), ele olha a agenda, passa a previsão de retorno + o site, abre a pendência e avisa
  # você pelo WhatsApp. Depois fica em silêncio: o que chegar só é repassado.
  alfred_whatsapp:
    perfil: pedro_dev
    papel: assistente
    instancia: alfred-assistente  # nome da instância na Evolution API
    audio_max_segundos: 600
    contatos_ignorar: []          # substrings de número ou nome que o Alfred não recepciona
    historico: true
    assistente:
      site: ""                    # ex.: https://seusite.com — vazio = a mensagem sai sem o site
      silencio_horas: 12          # depois de responder, o Alfred não fala de novo com o contato por isso
      # O que o Alfred pode contar de você a quem pergunta (experiência, serviços, projetos). Só sai daqui e da
      # `descricao` do perfil; a memória não entra. Vazio = ele só diz quem é e que avisa você.
      apresentacao: ""
      # Modelo do Ollama que conversa com o contato e julga se é sério. Vazio = o modelo padrão (MODEL_CHAT).
      # gemma4:e4b é mais leve (~1 s por resposta já carregado, contra 2 a 3 s), mas no teste de 10/11 conversou
      # pior: se reapresentava, repetia frase e empurrava a apresentação fora de hora. Na 3060 ele também não cabe
      # junto com o 12b (cada troca recarrega ~10 s). Para testar de novo: modelo: "gemma4:e4b"
      modelo: ""
      respostas_max: 8            # respostas do Alfred por contato, além da saudação, dentro de silencio_horas
      saudacao: "Olá! Aqui é o Alfred, assistente do Pedro Netto. Como posso ajudar?"
      retorno: "O Pedro não está disponível agora. Pela agenda dele, a previsão de retorno é {previsao}. Já avisei ele da sua mensagem."
      # Você → número do Alfred (texto ou áudio): vai para o motor da conversa, que usa as ferramentas.
      # Ferramentas perigosas desta lista rodam sem perguntar; as outras (executar_comando, responder_pendencia,
      # responder_limpeza) pedem "sim" ou "não" no próprio WhatsApp.
      sem_aprovacao: [criar_compromisso, completar_tarefa, salvar_nota]
    pendencias:
      tts_voice: "pt-BR-AntonioNeural"
      template_pergunta: pergunta_whatsapp
      template_audio: audio_pergunta_whatsapp

# ── Agenda — compromissos detectados → calendário do Thunderbird ──
# Evento / tarefa / lembrete com data detectado no WhatsApp (contatos ou notas para você mesmo)
# ou "vou" num convite de e-mail → VAULT_ALFRED/agenda/agenda.yml → extensão "Alfred — agenda"
# grava no calendário abaixo (o Google, via CalDAV, aparece no celular).
agenda:
  calendario: "Agenda"          # nome do calendário no Thunderbird
  duracao_min: 60               # duração padrão de evento sem hora de término
  lembrete_min: 30              # alarme antes do horário (0 = sem alarme)
  confianca_minima: 0.7         # abaixo disso a detecção é ignorada
  auto_whatsapp: true           # mensagens de contatos com compromisso marcado
  notas_para_mim: true          # o que você escreve para si mesmo no WhatsApp ("me lembra de...")
  auto_email_vou: true          # responder "vou" a um convite de e-mail com data
  criar_tarefa: true            # tarefa/lembrete também vira item em tasks.yml
  notificar: true               # notificação no PC com [Ok] [Desfazer]
  resumir: true                 # Resumo do Alfred (resumo, urgência, prioridade) ao criar cada item — 1 chamada ao LLM

# ── Promessas — o que você disse que ia fazer (inbox/promessas.py) ──
# Roda no fim do ciclo do e-mail (07:30 / 18:30): lê o que você ENVIOU (WhatsApp e pasta Enviados),
# com a conversa como contexto. Promessa → tarefa na agenda no prazo; prazo vencido sem sinal de que
# foi feita → "Atrasado: …" na agenda no dia seguinte às 09:00. `run.sh promessas` lista.
promessas:
  ativo: true
  canais: [whatsapp, email]
  pastas_enviados: [Sent]       # nome da pasta no disco do Thunderbird (Outlook: Sent)
  janela_horas: 48              # quanto para trás cada ciclo olha (o que já foi lido não é relido)
  prazo_padrao_dias: 3          # promessa sem data ("depois te mando") vence N dias depois da mensagem
  confianca_minima: 0.7         # abaixo disso a detecção é ignorada

# ── Memória automática — fatos duráveis sobre Pedro e seus contatos ──
# _shared/lib_memoria.py: extrai fatos (LLM local) → deduplica → SQLite FTS5 + vetores bge-m3.
# Espelho legível em VAULT_ALFRED/memoria/<sujeito>.md (gerado; editar lá não muda a memória).
# Ainda não ligada aos fluxos do inbox — ver _shared/about.md.
memoria:
  ativo: true
  db: ""                        # vazio = VAULT_ALFRED/memoria/memoria.db (MEMORIA_DB no ambiente vence)
  modelo: ""                    # vazio = MODEL_CLASSIFY → MODEL_CHAT
  modelo_embed: "bge-m3"        # trocar exige rodar `auditar` (refaz os vetores do modelo antigo)
  limiar_duplicata: 0.85        # cosseno acima disso → o LLM decide manter_novo / manter_antigo / fundir
  limiar_contexto: 0.45         # cosseno mínimo para um fato entrar no contexto pela busca vetorial
  max_caracteres: 6000          # texto mais longo que isso é cortado antes da extração
  auditar_lote: 60              # fatos por chamada do LLM na auditoria

# ── Pesquisa profunda — researcher com "profundo": true ───────
# Modelo leve no plano e nas notas de cada página; o maior só no relatório final.
# RESEARCH_MODEL_NOTAS / RESEARCH_MODEL_SINTESE no .env passam por cima (máquina sem o qwen, por ex.).
pesquisa:
  modelo_notas: "gemma4:e4b"
  modelo_sintese: "qwen3.6:35b-a3b"   # vazio = MODEL_CHAT
  relevancia_minima: 0.5              # cosseno subpergunta × (título + trecho) para baixar a página (0 = baixa tudo)
  categorias: "general"               # categoria do SearXNG nos dois modos; resultado vazio → repete em "news,it"
  fontes_academicas: ["openalex", "semanticscholar"]   # bases de artigos quando o plano marca o tema como acadêmico
                                                       # (profundo); [] desliga. Sem chave; OPENALEX_MAILTO no .env é opcional

# ── Conversa com o Alfred — services/inbox/conversa.py (aba Conversa do Painel) ──
# Tool calling nativo (lib_ferramentas), bloco "Agora", memória e histórico. Medições e a troca de modelo
# na RTX 3060: services/inbox/about.md → "Conversa com o Alfred".
conversa:
  modelo: ""                    # vazio = MODEL_CHAT
  modelo_ferramentas: ""        # vazio = o mesmo. Ex.: "gemma4:e4b" decide as ferramentas e o modelo acima escreve
                                # a resposta final (sem tools) — na 3060 os dois não cabem juntos: troca a cada turno
  num_ctx: 16384                # o gemma4:12b ocupa ~8,4 GB de VRAM com 4k ou 32k: o contexto não pesa aqui

# ── Orquestrador — _shared/lib_orquestrador.py ────────────────
# Classifica o pedido por regras (texto / ferramenta / codigo), escolhe o modelo de cada tipo olhando o que já
# está na placa e a VRAM livre, e avalia o risco de comandos e scripts sugeridos por um modelo.
# Só entram modelos instalados (`ollama list`); nome que o Ollama não tem é pulado.
orquestrador:
  ativo: true                   # false = tudo no modelo da conversa, como antes
  modelos:                      # por tipo, em ordem de preferência; [] = o modelo da conversa
    texto: ["gemma4:e4b", "gemma4:12b"]   # o já carregado vence; nada carregado → o primeiro que couber na VRAM livre
    ferramenta: []              # [] = conversa.modelo_ferramentas, ou conversa.modelo
    codigo: ["gemma4:12b"]      # qwen3.6:35b-a3b (22 GB) não cabe na 3060: só se também entrar em pode_trocar
  pode_trocar: []               # tipos que podem tirar o modelo da conversa da placa (~10 s na ida e na volta)
  folga_vram_mb: 600            # sobra exigida além do tamanho do modelo para carregar sem tirar ninguém
  vram_mb: {}                   # VRAM medida por modelo, ex.: {"gemma4:12b": 8400}; sem isso: arquivo × 1,15
  desempate_laya: false         # pedido sem sinal nas regras: true pergunta ao Laya (zero-shot, ainda não medido);
                                # false = vai como "ferramenta", o turno completo
  risco:
    segunda_opiniao: true       # sem regra que decida, um LLM local opina; sem resposta → pergunta a Pedro
    modelo: ""                  # vazio = o modelo de `codigo` (o que já estiver carregado)

# ── Defaults globais ──────────────────────────────────────────
defaults:
  vault_alfred_subfolders:
    briefings: "briefings"
    research: "research"
    licitacoes: "licitacoes"
    decisions: "decisions"
    logs: "logs"
    jornal: "jornal"
    pendencias: "pendencias"