perfis:
  pedro_dev:
    descricao: "Pedro Netto, estudante de ADS, foco em IA local e self-hosting"
    interesses_quentes:
      - DevOps e automação
      - homelab e self-hosting
      - LLMs locais
      - RAG e vector databases
      - Ollama e modelos open-source
    interesses_mornos:
      - Kubernetes
      - observabilidade
      - Rust
    excluir:
      - blockchain marketing
    idiomas: [pt, en]
    tom: "técnico, direto, humor seco britânico"

  attanotech:
    nome: "AttanoTech"
    descricao: "Consultoria de TI, ME/EPP, atende interior de SP"
    area: "Consultoria de tecnologia e projetos/implantações de TI"
    servicos:
      - consultoria em tecnologia da informação
      - desenvolvimento de software
      - implantação de sistemas
      - suporte técnico em TI
      - infraestrutura de redes
      - cloud computing e migração
      - segurança da informação
      - treinamento em tecnologia
      - manutenção de equipamentos de informática
      - outsourcing de TI
    palavras_chave:
      - tecnologia da informação
      - desenvolvimento de software
      - sistemas de informação
      - consultoria TI
      - infraestrutura de rede
      - segurança cibernética
      - cloud computing
      - suporte técnico
      - licenciamento de software
      - transformação digital
      - inteligência artificial
      - automação
    tom: "executivo, foco em oportunidades concretas"

# ── Coleções de fontes reutilizáveis ──────────────────────────
fontes:
  searxng_tech:
    tipo: searxng
    queries:
      - { q: "últimas notícias tecnologia", cat: "news,it" }
      - { q: "cloud computing infraestrutura novidades", cat: "news,it" }
      - { q: "cibersegurança vulnerabilidade", cat: "news,it" }
      - { q: "open source", cat: "news,it" }
      - { q: "notícias tecnologia", cat: "news,it" }
      - { q: "startups tech", cat: "news,it" }

  rss_tech:
    tipo: rss
    feeds:
      - { nome: "TabNews", url: "https://www.tabnews.com.br/recentes/rss", max: 10 }
      - { nome: "Hacker News", url: "https://hnrss.org/frontpage", max: 10 }
      - { nome: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/index", max: 5 }
      - { nome: "The Verge", url: "https://www.theverge.com/rss/index.xml", max: 5 }
      - { nome: "TechCrunch", url: "https://techcrunch.com/feed/", max: 5 }
      - { nome: "InfoQ", url: "https://feed.infoq.com/", max: 5 }
      - { nome: "Lobsters", url: "https://lobste.rs/rss", max: 5 }
      - { nome: "TLDR", url: "https://tldr.tech/api/rss/tech", max: 10 }
      - { nome: "MIT Tech Review", url: "https://www.technologyreview.com/feed/", max: 5 }
      - { nome: "Tecnoblog", url: "https://tecnoblog.net/feed/", max: 5 }

# ── Definições de briefings ───────────────────────────────────
briefings:
  matinal_tech:
    perfil: pedro_dev
    fontes: [rss_tech]
    horario: "07:00"
    max_items: 15
    formato: [markdown, audio]
    tts_voice: "pt-BR-FranciscaNeural"
    template_prompt: briefing_tecnico
    template_audio: audio_tecnico

  vespertino_mercado:
    perfil: attanotech
    fontes: [searxng_tech, rss_tech]
    horario: "18:00"
    max_items: 10
    formato: [markdown, audio]
    tts_voice: "pt-BR-AntonioNeural"
    template_prompt: briefing_executivo
    template_audio: audio_executivo

scanners: {}

# ── Defaults globais ──────────────────────────────────────────
defaults:
